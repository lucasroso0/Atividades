<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionários</title>
</head>
<body>
    <h1>Cadastro de Funcionários</h1>

    <form id="formulario">
        <input type="hidden" id="indiceEdicao">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>
        <br><br>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" required>
        <br><br>

        <label for="cargo">Cargo:</label>
        <input type="text" id="cargo" required>
        <br><br>

        <label for="salario">Salário:</label>
        <input type="number" id="salario" required>
        <br><br>

        <button type="submit">Cadastrar</button>
    </form>

    <h2>Lista de Funcionários</h2>
    <table id="tabela-funcionarios">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cargo</th>
                <th>Salário</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="lista-funcionarios"></tbody>
    </table>
    

    <h2>Relatórios</h2>
    <button id="listarSalarioAlto">Funcionários com salário > R$ 5000</button>
    <button id="mediaSalarial">Média Salarial</button>
    <button id="cargosUnicos">Cargos Únicos</button>
    <button id="nomesMaiusculo">Nomes em Maiúsculo</button>

    <div id="relatorios"></div>

    <script src="funcionario.js"></script>
</body>
</html>
