<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
</head>
<body>
    <h1>Cadastro de Alunos</h1>

    <form id="formulario">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>
        <br><br>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" required>
        <br><br>

        <label for="curso">Curso:</label>
        <input type="text" id="curso" required>
        <br><br>

        <label for="notaFinal">Nota Final:</label>
        <input type="number" id="notaFinal" step="0.1" required>
        <br><br>

        <button type="submit">Cadastrar</button>
    </form>

    <h2>Lista de Alunos</h2>
    <div id="lista-alunos"></div>

    <h2>Relatórios</h2>
    <button id="listarAprovados">Listar Aprovados</button>
    <button id="mediaNotas">Média das Notas</button>
    <button id="mediaIdades">Média das Idades</button>
    <button id="ordenarNomes">Ordenar Nomes</button>
    <button id="quantidadePorCurso">Quantidade por Curso</button>

    <div id="relatorios"></div>

    <script src="aluno.js"></script>
</body>
</html>
